name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # H3-INFRA-F1 recurrence guard: this is the ONLY job that can catch an
  # unparseable ci.yml, because a YAML error prevents every job IN that file
  # from being scheduled (GitHub silently falls back to a single anonymous
  # run named `.github/workflows/ci.yml`). It has no dependencies and no
  # checkout-heavy setup, so it reports in seconds.
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # js-yaml is a transitive dep of eslint; `npm ci` guarantees it is
      # present and hoisted before the script imports it.
      - name: Install dependencies
        run: npm ci

      - name: Validate workflow YAML (js-yaml)
        run: node scripts/check-workflows.mjs

  test:
    runs-on: ubuntu-latest
    env:
      # High-entropy, CI-only invite code. NEVER reuse this value in a deployed
      # environment — the invite code is the single privilege gate to lecturer
      # role (security audit H-1). Provision a fresh, random, high-entropy code
      # (>= 24 chars) per environment and rotate it.
      LECTURER_INVITE_CODE: ci-invite-code-7f3a9c2e4b8d1f6a0e5c7b3a
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # H3-INFRA-F1 recurrence guard (this YAML has been broken twice). Runs
      # before the expensive steps so a syntax error fails in seconds. The
      # dedicated `workflow-lint` job below is the load-bearing copy (a step
      # inside ci.yml cannot run when ci.yml itself is unparseable).
      - name: Validate workflow YAML
        run: npm run lint:workflows

      - name: Start local Supabase
        run: npx supabase start
        timeout-minutes: 10

      - name: Write .env.local from Supabase status
        run: |
          npx supabase status -o env > .env.local
          # `supabase status -o env` emits API_URL/ANON_KEY/SERVICE_ROLE_KEY, but
          # the app/scripts read NEXT_PUBLIC_SUPABASE_URL/NEXT_PUBLIC_SUPABASE_ANON_KEY/
          # SUPABASE_SERVICE_ROLE_KEY. Map them explicitly (and strip quotes).
          echo "NEXT_PUBLIC_SUPABASE_URL=$(grep '^API_URL=' .env.local | cut -d= -f2- | tr -d '\"')" >> .env.local
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(grep '^ANON_KEY=' .env.local | cut -d= -f2- | tr -d '\"')" >> .env.local
          echo "SUPABASE_SERVICE_ROLE_KEY=$(grep '^SERVICE_ROLE_KEY=' .env.local | cut -d= -f2- | tr -d '\"')" >> .env.local
          # Add the non-Supabase vars needed by the app/tests
          echo "LECTURER_INVITE_CODE=${{ env.LECTURER_INVITE_CODE }}" >> .env.local
          echo "AI_BASE_URL=https://api.openai.com/v1" >> .env.local
          echo "AI_API_KEY=test-key" >> .env.local
          echo "AI_MODEL=gpt-4o-mini" >> .env.local
          echo "OCR_DEFAULT_ENGINE=tesseract" >> .env.local
          echo "GLM_BASE_URL=http://localhost:11434" >> .env.local
          echo "OCR_GLM_MODEL=glm-ocr" >> .env.local
          echo "OCR_VISION_MODEL=gpt-4o-mini" >> .env.local

      - name: Reset DB (apply migrations)
        run: npx supabase db reset

      - name: Regenerate types
        run: npm run gen:types

      - name: Check database types drift
        run: git diff --exit-code src/lib/types/database.ts

      - name: Validate i18n parity
        run: node scripts/check-i18n.mjs

      - name: Env parity (audit-1 §5.5)
        run: node scripts/check-env-parity.mjs

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit coverage (per-file thresholds)
        run: npx vitest run --coverage

      - name: Phase 1 security probes (live DB, real tokens)
        run: npm run verify:security

      - name: Phase 2 classes probes (D8/D12)
        run: npm run verify:classes

      - name: "Class archiving probes (D26b: archive/restore lifecycle)"
        run: npm run verify:class-archiving

      - name: Phase 3 quizzes probes (D5/D6/D19-D24)
        run: npm run verify:quizzes

      - name: Phase 4 AI probes (D34-D40)
        run: npm run verify:ai

      - name: Phase 5 session probes (D1/D1b/D2-D4/D7/D9/D42-D47)
        run: npm run verify:sessions

      - name: Phase 7 face probes (D10/D11/D13/D14 + P7 pins)
        run: npm run verify:face

      - name: Phase 8 results probes (D13-reset / I21-D / D-view + status matrix)
        run: npm run verify:results

      - name: Phase SQ student-quiz probes (SQ-D1-D8)
        run: npm run verify:student-quizzes

      - name: "Clone-quiz probes (AP2-D1-D10 + QT1-D9 multi answer-key fidelity)"
        run: npm run verify:clone

      - name: "Media probes (MEDIA-D1-D10: storage deny-by-default, image visibility, save RPC)"
        run: npm run verify:media

      - name: "Matric number probes (0027: trigger/uniqueness/RLS/roster)"
        run: npm run verify:matric

      - name: "Web-source probes (0040/0041: web sources + multi-file provenance)"
        run: npm run verify:web-sources

      - name: "Silence-cron probes (0042/0044/0045: flag_verify_silent_sessions predicates)"
        run: npm run verify:silence

      - name: Build
        run: npm run build

      - name: Phase 6 MediaPipe asset integrity (SHA-256 vs MANIFEST)
        run: npm run verify:mediapipe

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # H3-INFRA-F3: the 15 -> 25 timeout raise has never been exercised, and a
      # step timeout is indistinguishable from a test failure in the summary.
      # Record the start in its OWN step (a killed step's $GITHUB_ENV may not
      # be flushed, so writing it inside the E2E run block is not reliable).
      - name: Record E2E start
        id: e2e_start
        run: echo "E2E_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: E2E (E1a + E1 + E1b regression + mobile m1 allowlist)
        id: e2e
        run: npx playwright test
        # Desktop suite + the mobile project's m1-*.spec.ts allowlist
        # (plan §6): the m1 journeys add ~4-7 min at workers:1 on top of the
        # desktop budget, hence 15 -> 25.
        timeout-minutes: 25
        continue-on-error: false

      - name: Report E2E step outcome
        # Only when the E2E step itself failed. A timeout lands as `failure`
        # (or `cancelled`); an earlier-step failure leaves it `skipped`, which
        # is why this is not a bare `if: failure()`.
        if: failure() && steps.e2e.outcome != 'skipped'
        run: |
          OUTCOME="${{ steps.e2e.outcome }}"
          BUDGET=$(( 25 * 60 ))
          if [ -n "${E2E_START_EPOCH:-}" ] && [ "${E2E_START_EPOCH}" != "0" ]; then
            ELAPSED=$(( $(date +%s) - E2E_START_EPOCH ))
          else
            ELAPSED=0
          fi
          if [ "$ELAPSED" -ge "$BUDGET" ]; then
            VERDICT="TIMEOUT — the step was killed at its 25-minute budget, NOT a Playwright test failure."
          elif [ "$ELAPSED" -eq 0 ]; then
            VERDICT="the step failed before/at the start marker could be read — treat as a real failure."
          else
            VERDICT="ran ${ELAPSED}s of the ${BUDGET}s budget — a real test/tooling failure, not a timeout."
          fi
          {
            echo "### E2E step: \`e2e\` outcome=\`$OUTCOME\`"
            echo ""
            echo "$VERDICT"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "E2E step outcome=$OUTCOME elapsed=${ELAPSED}s — $VERDICT"

  integrity-e2e:
    # Opt-in hardening suite (e51): the main job's build bakes
    # NEXT_PUBLIC_INTEGRITY_HARDENING_OFF=1 (playwright.config.ts), which is
    # exactly right for every other spec but makes the clipboard/fullscreen
    # hardening inert — e51 could never run there and would drift silently.
    # This job runs ONLY e51 against a build with the hardening baked IN
    # (INTEGRITY_E2E=1 makes the webServer env omit the kill switch). E51's
    # full two-role journeys cost a second `next build` + ~5 min of specs.
    runs-on: ubuntu-latest
    env:
      # Same CI-only invite code as the `test` job (see its comment there).
      LECTURER_INVITE_CODE: ci-invite-code-7f3a9c2e4b8d1f6a0e5c7b3a
      # Drives playwright.config.ts: the webServer env OMITS
      # NEXT_PUBLIC_INTEGRITY_HARDENING_OFF, so `next build` bakes the
      # hardening IN; e51's own test.skip gate keys on the same var.
      INTEGRITY_E2E: "1"
      # audit-1 §5.3: e51's SKIP gate is now dedicated to this job (the
      # build-env signal INTEGRITY_E2E stays separate, so a leaked
      # INTEGRITY_E2E in a local .env.local can no longer run e51 against a
      # hardening-OFF build).
      E51_HARDENING_E2E: "1"
      # H3-INFRA-F2 review: the job's OWN pre-build (below) runs `next build`
      # outside playwright.config.ts's webServer env, so without these the
      # BUILD_ID it seeds belongs to a bundle with the fake seams OFF — and the
      # :3002 server (which polls .next/BUILD_ID) would serve that seam-less
      # build until the main webServer rebuilds. Mirror the webServer's
      # build-time env exactly. NEXT_PUBLIC_INTEGRITY_HARDENING_OFF is
      # deliberately ABSENT (hardening must stay baked IN for e51).
      NEXT_PUBLIC_E2E_FAKE_SEAM: "1"
      FACE_MOCK_ENABLED: "1"
      INSIGHTFACE_BASE_URL: "http://localhost:8000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase
        run: npx supabase start
        timeout-minutes: 10

      - name: Write .env.local from Supabase status
        run: |
          npx supabase status -o env > .env.local
          echo "NEXT_PUBLIC_SUPABASE_URL=$(grep '^API_URL=' .env.local | cut -d= -f2- | tr -d '\"')" >> .env.local
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(grep '^ANON_KEY=' .env.local | cut -d= -f2- | tr -d '\"')" >> .env.local
          echo "SUPABASE_SERVICE_ROLE_KEY=$(grep '^SERVICE_ROLE_KEY=' .env.local | cut -d= -f2- | tr -d '\"')" >> .env.local
          echo "LECTURER_INVITE_CODE=${{ env.LECTURER_INVITE_CODE }}" >> .env.local
          echo "AI_BASE_URL=https://api.openai.com/v1" >> .env.local
          echo "AI_API_KEY=test-key" >> .env.local
          echo "AI_MODEL=gpt-4o-mini" >> .env.local
          echo "OCR_DEFAULT_ENGINE=tesseract" >> .env.local
          echo "GLM_BASE_URL=http://localhost:11434" >> .env.local
          echo "OCR_GLM_MODEL=glm-ocr" >> .env.local
          echo "OCR_VISION_MODEL=gpt-4o-mini" >> .env.local

      - name: Reset DB (apply migrations)
        run: npx supabase db reset

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: "Build (hardening-ON: INTEGRITY_E2E omits the kill switch)"
        run: npm run build
        # Playwright starts ALL FOUR webServers on every run regardless of
        # --project filtering; the :3002 server polls .next/BUILD_ID with a
        # 120s timeout. Without this pre-step the BUILD_ID only appears when
        # the main webServer finishes its own build (budgeted 300s), so any
        # build slower than 120s would abort the job before e51 runs.

      - name: E2E integrity hardening (e51 only, hardening-ON build)
        run: npx playwright test e2e/e51-integrity-hardening.spec.ts --project=chromium
        # Build (~5 min, no cache sharing with the main job) + two full
        # two-role journeys at workers:1 (CI forces workers=1).
        timeout-minutes: 25
