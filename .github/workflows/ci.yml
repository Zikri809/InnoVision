name: CI

on:
  push:
    branches: [main]
    # Docs/markdown-only commits still get the fast `checks` gate (it is
    # deliberately NOT skipped — docs can break env-parity or i18n scripts),
    # but skip the expensive Supabase/E2E/probe legs that cannot be affected
    # by a .md edit. This cut 10 of the last 60 commits (~30 min each) down
    # to the 1-2 min checks job.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "design-system/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "design-system/**"

# A new push to the same branch cancels the superseded run instead of letting
# two full E2E suites queue for the same 25-minute budget.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # H3-INFRA-F1 recurrence guard: this is the ONLY job that can catch an
  # unparseable ci.yml, because a YAML error prevents every job IN that file
  # from being scheduled (GitHub silently falls back to a single anonymous
  # run named `.github/workflows/ci.yml`). It has no dependencies and no
  # checkout-heavy setup, so it reports in seconds.
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # js-yaml is a transitive dep of eslint; `npm ci` guarantees it is
      # present and hoisted before the script imports it.
      - name: Install dependencies
        run: npm ci

      - name: Validate workflow YAML (js-yaml)
        run: node scripts/check-workflows.mjs

  # Fast fail-fast gate: lint, typecheck, unit coverage, drift/parity checks.
  # No Supabase, no build, no browser. Reports in ~2 minutes so a broken
  # commit is known before the E2E legs finish. Deliberately separate from
  # `e2e`/`probes` so a unit failure no longer SKIPS the E2E step (the old
  # monolithic `test` job did exactly that — the 2026-09-14 dependabot run
  # 34883964808 died at "Unit coverage" and E2E never ran).
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # H3-INFRA-F1 recurrence guard (this YAML has been broken twice). Runs
      # before the expensive steps so a syntax error fails in seconds. The
      # dedicated `workflow-lint` job above is the load-bearing copy (a step
      # inside ci.yml cannot run when ci.yml itself is unparseable).
      - name: Validate workflow YAML
        run: npm run lint:workflows

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Per-file thresholds are enforced by the vitest config; a coverage drop
      # fails here without needing Supabase.
      - name: Unit coverage (per-file thresholds)
        run: npx vitest run --coverage

      - name: Validate i18n parity
        run: node scripts/check-i18n.mjs

      - name: Env parity (audit-1 §5.5)
        run: node scripts/check-env-parity.mjs

  # Gate S5: the four kill switches must NEVER reach a CI build. Shared by the
  # e2e and integrity-e2e jobs below via the `env` below (which both jobs
  # reference by re-declaring the job-level env block inline).
  e2e:
    # The artifact CI ships is built here (kill switches OFF), so this job is
    # also where the S5 gate assertion lives. See the long comment in the
    # assert step below.
    runs-on: ubuntu-latest
    env:
      # High-entropy, CI-only invite code. NEVER reuse this value in a deployed
      # environment — the invite code is the single privilege gate to lecturer
      # role (security audit H-1). Provision a fresh, random, high-entropy code
      # (>= 24 chars) per environment and rotate it.
      LECTURER_INVITE_CODE: ci-invite-code-7f3a9c2e4b8d1f6a0e5c7b3a
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase
        run: npx supabase start
        timeout-minutes: 10

      - name: Write .env.local from Supabase status
        run: |
          npx supabase status -o env > .env.local
          # `supabase status -o env` emits API_URL/ANON_KEY/SERVICE_ROLE_KEY, but
          # the app/scripts read NEXT_PUBLIC_SUPABASE_URL/NEXT_PUBLIC_SUPABASE_ANON_KEY/
          # SUPABASE_SERVICE_ROLE_KEY. Map them explicitly (and strip quotes).
          echo "NEXT_PUBLIC_SUPABASE_URL=$(grep '^API_URL=' .env.local | cut -d= -f2- | tr -d '\"')" >> .env.local
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(grep '^ANON_KEY=' .env.local | cut -d= -f2- | tr -d '\"')" >> .env.local
          echo "SUPABASE_SERVICE_ROLE_KEY=$(grep '^SERVICE_ROLE_KEY=' .env.local | cut -d= -f2- | tr -d '\"')" >> .env.local
          # Add the non-Supabase vars needed by the app/tests
          echo "LECTURER_INVITE_CODE=${{ env.LECTURER_INVITE_CODE }}" >> .env.local
          echo "AI_BASE_URL=https://api.openai.com/v1" >> .env.local
          echo "AI_API_KEY=test-key" >> .env.local
          echo "AI_MODEL=gpt-4o-mini" >> .env.local
          echo "OCR_DEFAULT_ENGINE=tesseract" >> .env.local
          echo "GLM_BASE_URL=http://localhost:11434" >> .env.local
          echo "OCR_GLM_MODEL=glm-ocr" >> .env.local
          echo "OCR_VISION_MODEL=gpt-4o-mini" >> .env.local
          # GLM-OCR provider selector: the FREE local leg. CI has no Z.ai key
          # and must never select the metered leg (a unit/route test that
          # reaches the remote path would bill a real account). Fail-closed in
          # the app, explicit here so the build env is self-consistent.
          echo "GLM_PROVIDER=local" >> .env.local

      - name: Reset DB (apply migrations)
        run: npx supabase db reset

      - name: Regenerate types
        run: npm run gen:types

      - name: Check database types drift
        run: git diff --exit-code src/lib/types/database.ts

      # Gate S5 recurrence guard: the four kill switches must NEVER reach a CI
      # build. Two of them (NEXT_PUBLIC_E2E_FAKE_SEAM, NEXT_PUBLIC_INTEGRITY_
      # HARDENING_OFF) are inlined at BUILD time, so a leaked value here bakes
      # fake tracker seams into the artifact this job builds and runs. The
      # other two disarm the rate limiter / the real face engine at RUNTIME.
      # `src/lib/prod-guards.ts` catches this at app boot in production, but
      # that is too late for CI: the artifact would already be built. Assert on
      # the BUILD env here, before the expensive steps.
      #
      # WHICH ENVIRONMENT THIS COVERS — read carefully before "fixing" it:
      # this step reads the JOB env only: the `env:` block at the top of this
      # job plus anything exported into the shell by an earlier `run:` step
      # (e.g. `$GITHUB_ENV`). That is the env `npm run build` below inherits,
      # so it is the right thing to assert on.
      #
      # It deliberately does NOT cover the Playwright webServer env. That env
      # is a SEPARATE, child-process-only environment assembled in
      # playwright.config.ts, and it LEGITIMATELY arms two of the four switches
      # for the E2E step: `NEXT_PUBLIC_E2E_FAKE_SEAM: "1"` and
      # `NEXT_PUBLIC_INTEGRITY_HARDENING_OFF: "1"` (plus E2E_RATE_LIMIT_DISABLED
      # and FACE_MOCK_ENABLED). That is by design — the suite drives fake
      # tracker seams and needs the clipboard/fullscreen hardening inert. Those
      # values never reach this step's env, so the "OK" line below describes
      # the JOB/BUILD env, NOT the environment the E2E webServer runs in.
      # Consequence: this step is a guard on the artifact CI ships, and must
      # not be extended to police the harness's own deliberate configuration.
      #
      # The `integrity-e2e` job has no such step: its job-level env carries
      # NEXT_PUBLIC_E2E_FAKE_SEAM=1 and FACE_MOCK_ENABLED=1 on purpose (to bake
      # the fake seams in for e51 while omitting the hardening kill switch), so
      # this four-switch check would fail on that job's correct configuration.
      #
      # Comparison is NORMALIZED (trim + lowercase) so casing/whitespace
      # variants (`False`, `"0 "`) are handled deliberately rather than by
      # accident. Anything that is not absent/0/false is treated as ARMED and
      # fails the step — fail-closed.
      #
      # Deliberately INLINE (no script file): this is a short env assertion and
      # a new script would need its own tests/parity wiring.
      #
      # Do not add any of these four to a job's top-level `env:`.
      - name: Assert kill switches are absent from the build env
        run: |
          fail=0
          for key in E2E_RATE_LIMIT_DISABLED NEXT_PUBLIC_E2E_FAKE_SEAM FACE_MOCK_ENABLED NEXT_PUBLIC_INTEGRITY_HARDENING_OFF; do
            raw="${!key:-}"
            # Normalize before comparing: trim surrounding whitespace, then
            # lowercase. Without this, "False" and "0 " were rejected only as a
            # side effect of the glob not matching — safe (fail-closed) but
            # surprising, and the intent was never stated. The RAW value is kept
            # for the error message, so the operator sees exactly what leaked.
            value="${raw#"${raw%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            value="${value,,}"
            case "$value" in
              ""|"0"|"false") ;;
              *)
                echo "::error::kill switch $key=$raw is set in the CI build env — it must be absent or 0 (gate S5)."
                fail=1
                ;;
            esac
          done
          if [ "$fail" -ne 0 ]; then
            echo "Refusing to build: a kill switch above would bake fake seams into the artifact."
            exit 1
          fi
          echo "OK — in the JOB/BUILD env (not the Playwright webServer env, which arms two of them on purpose) E2E_RATE_LIMIT_DISABLED / NEXT_PUBLIC_E2E_FAKE_SEAM / FACE_MOCK_ENABLED / NEXT_PUBLIC_INTEGRITY_HARDENING_OFF are all absent or 0."

      - name: Build
        run: npm run build

      - name: Phase 6 MediaPipe asset integrity (SHA-256 vs MANIFEST)
        run: npm run verify:mediapipe

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: "Build for E2E (fake seams)"
        run: npm run build
        env:
          NEXT_PUBLIC_E2E_FAKE_SEAM: "1"
          NEXT_PUBLIC_INTEGRITY_HARDENING_OFF: "1"
          FACE_MOCK_ENABLED: "1"
          INSIGHTFACE_BASE_URL: "http://localhost:8000"

      # H3-INFRA-F3: the timeout raise has never been exercised, and a step
      # timeout is indistinguishable from a test failure in the summary.
      # Record the start in its OWN step (a killed step's $GITHUB_ENV may not
      # be flushed, so writing it inside the E2E run block is not reliable).
      - name: Record E2E start
        id: e2e_start
        run: echo "E2E_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      # 40-minute budget: the last full run (34935325321, 2026-09-15) reached
      # test 177/182 when the 25-minute cap killed it — the suite outgrew the
      # budget, it did not fail. The prebuild above keeps the budget 100%
      # test execution (PLAYWRIGHT_SKIP_BUILD=1 below).
      - name: E2E (E1a + E1 + E1b regression + mobile m1 allowlist)
        id: e2e
        run: npx playwright test
        env:
          PLAYWRIGHT_SKIP_BUILD: "1"
        # Desktop suite + mobile allowlist across 2 CI workers.
        timeout-minutes: 40
        continue-on-error: false

      - name: Report E2E step outcome
        # Only when the E2E step itself failed or timed out. A timeout lands as
        # `cancelled` (or `failure`), which sets job status to cancelled where
        # a bare `failure()` is false. An earlier-step failure leaves it `skipped`.
        if: (failure() || cancelled()) && steps.e2e.outcome != 'skipped' && steps.e2e.outcome != 'success'
        run: |
          OUTCOME="${{ steps.e2e.outcome }}"
          BUDGET=$(( 40 * 60 ))
          if [ -n "${E2E_START_EPOCH:-}" ] && [ "${E2E_START_EPOCH}" != "0" ]; then
            ELAPSED=$(( $(date +%s) - E2E_START_EPOCH ))
          else
            ELAPSED=0
          fi
          if [ "$ELAPSED" -ge "$BUDGET" ]; then
            VERDICT="TIMEOUT — the step was killed at its 40-minute budget, NOT a Playwright test failure."
          elif [ "$ELAPSED" -eq 0 ]; then
            VERDICT="the step failed before/at the start marker could be read — treat as a real failure."
          else
            VERDICT="ran ${ELAPSED}s of the ${BUDGET}s budget — a real test/tooling failure, not a timeout."
          fi
          {
            echo "### E2E step: \`e2e\` outcome=\`$OUTCOME\`"
            echo ""
            echo "$VERDICT"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "E2E step outcome=$OUTCOME elapsed=${ELAPSED}s — $VERDICT"

  # DB/RLS/security probe suite (verify:*.mjs scripts) against a live local
  # Supabase. Split from the old monolithic `test` job: these only need
  # Postgres, not a browser or a Next build, and they no longer gate or gate
  # on the E2E leg. They still gate main: every probe is a security regression
  # pin (RLS isolation, one-attempt lock, answer secrecy).
  probes:
    runs-on: ubuntu-latest
    env:
      # Same CI-only invite code as the `e2e` job (see its comment there).
      LECTURER_INVITE_CODE: ci-invite-code-7f3a9c2e4b8d1f6a0e5c7b3a
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase
        run: npx supabase start
        timeout-minutes: 10

      - name: Write .env.local from Supabase status
        run: |
          npx supabase status -o env > .env.local
          echo "NEXT_PUBLIC_SUPABASE_URL=$(grep '^API_URL=' .env.local | cut -d= -f2- | tr -d '\"')" >> .env.local
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(grep '^ANON_KEY=' .env.local | cut -d= -f2- | tr -d '\"')" >> .env.local
          echo "SUPABASE_SERVICE_ROLE_KEY=$(grep '^SERVICE_ROLE_KEY=' .env.local | cut -d= -f2- | tr -d '\"')" >> .env.local
          echo "LECTURER_INVITE_CODE=${{ env.LECTURER_INVITE_CODE }}" >> .env.local
          echo "AI_BASE_URL=https://api.openai.com/v1" >> .env.local
          echo "AI_API_KEY=test-key" >> .env.local
          echo "AI_MODEL=gpt-4o-mini" >> .env.local
          echo "OCR_DEFAULT_ENGINE=tesseract" >> .env.local
          echo "GLM_BASE_URL=http://localhost:11434" >> .env.local
          echo "OCR_GLM_MODEL=glm-ocr" >> .env.local
          echo "OCR_VISION_MODEL=gpt-4o-mini" >> .env.local
          # GLM-OCR provider selector: the FREE local leg. CI has no Z.ai key
          # and must never select the metered leg (a unit/route test that
          # reaches the remote path would bill a real account). Fail-closed in
          # the app, explicit here so the build env is self-consistent.
          echo "GLM_PROVIDER=local" >> .env.local

      - name: Reset DB (apply migrations)
        run: npx supabase db reset

      - name: Phase 1 security probes (live DB, real tokens)
        run: npm run verify:security

      - name: Phase 2 classes probes (D8/D12)
        run: npm run verify:classes

      - name: "Class archiving probes (D26b: archive/restore lifecycle)"
        run: npm run verify:class-archiving

      - name: Phase 3 quizzes probes (D5/D6/D19-D24)
        run: npm run verify:quizzes

      - name: Phase 4 AI probes (D34-D40)
        run: npm run verify:ai

      - name: Phase 5 session probes (D1/D1b/D2-D4/D7/D9/D42-D47)
        run: npm run verify:sessions

      - name: Phase 7 face probes (D10/D11/D13/D14 + P7 pins)
        run: npm run verify:face

      - name: Phase 8 results probes (D13-reset / I21-D / D-view + status matrix)
        run: npm run verify:results

      - name: Phase SQ student-quiz probes (SQ-D1-D8)
        run: npm run verify:student-quizzes

      - name: "Clone-quiz probes (AP2-D1-D10 + QT1-D9 multi answer-key fidelity)"
        run: npm run verify:clone

      - name: "Media probes (MEDIA-D1-D10: storage deny-by-default, image visibility, save RPC)"
        run: npm run verify:media

      - name: "Matric number probes (0027: trigger/uniqueness/RLS/roster)"
        run: npm run verify:matric

      - name: "Web-source probes (0040/0041: web sources + multi-file provenance)"
        run: npm run verify:web-sources

      - name: "Silence-cron probes (0042/0044/0045: flag_verify_silent_sessions predicates)"
        run: npm run verify:silence

  integrity-e2e:
    # Opt-in hardening suite (e51): the e2e job's build bakes
    # NEXT_PUBLIC_INTEGRITY_HARDENING_OFF=1 (playwright.config.ts), which is
    # exactly right for every other spec but makes the clipboard/fullscreen
    # hardening inert — e51 could never run there and would drift silently.
    # This job runs ONLY e51 against a build with the hardening baked IN
    # (INTEGRITY_E2E=1 makes the webServer env omit the kill switch). E51's
    # full two-role journeys cost a second `next build` + ~5 min of specs.
    #
    # NO kill-switch assertion step here (unlike the `e2e` job): this job's
    # job-level env DELIBERATELY carries NEXT_PUBLIC_E2E_FAKE_SEAM=1 and
    # FACE_MOCK_ENABLED=1 (see the H3-INFRA-F2 note below), so the four-switch
    # check would fail on its own correct configuration. It also deliberately
    # OMITS NEXT_PUBLIC_INTEGRITY_HARDENING_OFF so the hardening is baked IN —
    # the opposite of the `e2e` job. The gate S5 enforcement lives in the
    # `e2e` job, which is the artifact CI ships.
    runs-on: ubuntu-latest
    env:
      # Same CI-only invite code as the `e2e` job (see its comment there).
      LECTURER_INVITE_CODE: ci-invite-code-7f3a9c2e4b8d1f6a0e5c7b3a
      # Drives playwright.config.ts: the webServer env OMITS
      # NEXT_PUBLIC_INTEGRITY_HARDENING_OFF, so `next build` bakes the
      # hardening IN; e51's own test.skip gate keys on the same var.
      INTEGRITY_E2E: "1"
      # audit-1 §5.3: e51's SKIP gate is now dedicated to this job (the
      # build-env signal INTEGRITY_E2E stays separate, so a leaked
      # INTEGRITY_E2E in a local .env.local can no longer run e51 against a
      # hardening-OFF build).
      E51_HARDENING_E2E: "1"
      # H3-INFRA-F2 review: the job's OWN pre-build (below) runs `next build`
      # outside playwright.config.ts's webServer env, so without these the
      # BUILD_ID it seeds belongs to a bundle with the fake seams OFF — and the
      # :3002 server (which polls .next/BUILD_ID) would serve that seam-less
      # build until the main webServer rebuilds. Mirror the webServer's
      # build-time env exactly. NEXT_PUBLIC_INTEGRITY_HARDENING_OFF is
      # deliberately ABSENT (hardening must stay baked IN for e51).
      NEXT_PUBLIC_E2E_FAKE_SEAM: "1"
      FACE_MOCK_ENABLED: "1"
      INSIGHTFACE_BASE_URL: "http://localhost:8000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase
        run: npx supabase start
        timeout-minutes: 10

      - name: Write .env.local from Supabase status
        run: |
          npx supabase status -o env > .env.local
          echo "NEXT_PUBLIC_SUPABASE_URL=$(grep '^API_URL=' .env.local | cut -d= -f2- | tr -d '\"')" >> .env.local
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(grep '^ANON_KEY=' .env.local | cut -d= -f2- | tr -d '\"')" >> .env.local
          echo "SUPABASE_SERVICE_ROLE_KEY=$(grep '^SERVICE_ROLE_KEY=' .env.local | cut -d= -f2- | tr -d '\"')" >> .env.local
          echo "LECTURER_INVITE_CODE=${{ env.LECTURER_INVITE_CODE }}" >> .env.local
          echo "AI_BASE_URL=https://api.openai.com/v1" >> .env.local
          echo "AI_API_KEY=test-key" >> .env.local
          echo "AI_MODEL=gpt-4o-mini" >> .env.local
          echo "OCR_DEFAULT_ENGINE=tesseract" >> .env.local
          echo "GLM_BASE_URL=http://localhost:11434" >> .env.local
          echo "OCR_GLM_MODEL=glm-ocr" >> .env.local
          echo "OCR_VISION_MODEL=gpt-4o-mini" >> .env.local
          # GLM-OCR provider selector: the FREE local leg. CI has no Z.ai key
          # and must never select the metered leg (a unit/route test that
          # reaches the remote path would bill a real account). Fail-closed in
          # the app, explicit here so the build env is self-consistent.
          echo "GLM_PROVIDER=local" >> .env.local

      - name: Reset DB (apply migrations)
        run: npx supabase db reset

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: "Build (hardening-ON: INTEGRITY_E2E omits the kill switch)"
        run: npm run build
        # Playwright starts ALL FOUR webServers on every run regardless of
        # --project filtering; the :3002 server polls .next/BUILD_ID with a
        # 120s timeout. Without this pre-step the BUILD_ID only appears when
        # the main webServer finishes its own build (budgeted 300s), so any
        # build slower than 120s would abort the job before e51 runs.

      - name: E2E integrity hardening (e51 only, hardening-ON build)
        run: npx playwright test e2e/e51-integrity-hardening.spec.ts --project=chromium
        env:
          PLAYWRIGHT_SKIP_BUILD: "1"
        # Prebuilt above (hardening-ON) + two full two-role journeys:
        # Reuses the prebuilt bundle so the budget is 100% test execution.
        timeout-minutes: 25
