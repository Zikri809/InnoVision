# audit-3 R3-HYG-F1(d): automated dependency advisories.
#
# The repo has ~29 caret-ranged production dependencies and no renovate config;
# nothing surfaced advisories between manual `npm outdated` runs. Weekly npm
# updates + github-actions updates keep the caret ranges moving and open PRs
# for security patches. PRs are grouped by dependency type so a normal week is
# a handful of reviewable PRs rather than dozens.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Security advisories are never grouped — they stay individually visible
      # and are labelled for triage.
      security:
        applies-to: security-updates
        patterns: ["*"]
      dev-dependencies:
        applies-to: version-updates
        dependency-type: "development"
        update-types: ["minor", "patch"]
      production-minor-patch:
        applies-to: version-updates
        dependency-type: "production"
        update-types: ["minor", "patch"]
    # Major bumps stay ungrouped (one PR each) so breaking changes are reviewed
    # in isolation rather than buried in a batch.

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
