# ─────────────────────────────────────────────────────────────────────────────
# nginx site for InnoVision — the HOST-NGINX topology.
#
# WHEN TO USE THIS FILE: the VPS already runs nginx on :80/:443 and it proxies
# to the app's loopback publish (127.0.0.1:3000). In that topology the compose
# `caddy` service MUST NOT be started — only one process can bind those ports,
# and Caddy would crash-loop on `address already in use` while the rest of the
# stack stayed healthy. `caddy` is profile-gated (`profiles: ["tls"]`) for
# exactly this reason: a bare `docker compose up -d` does not start it.
#
#   nginx (host) owns :80/:443  →  proxy_pass 127.0.0.1:3000  →  app container
#
# Install (Ubuntu/Debian layout):
#   sudo cp deploy/nginx/innovision.conf /etc/nginx/sites-available/innovision
#   sudo ln -sf /etc/nginx/sites-available/innovision /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# ── EVERY `proxy_set_header` BELOW IS LOAD-BEARING — read before editing ─────
#
# `Host $host` — pass the browser's Host through UNCHANGED. Do NOT rewrite it to
#   127.0.0.1:3000 or to an upstream name. Next's server-action CSRF check
#   compares the browser's `Origin` against `Host`/`X-Forwarded-Host`, so a
#   rewritten Host makes every action silently abort — the login form appears to
#   just reset, with no error anywhere. The app's own allowlist (ALLOWED_HOSTS
#   at BUILD, TRUSTED_ORIGINS at RUNTIME) is what makes a differing origin
#   acceptable; it is not a licence to rewrite Host.
#
# `X-Real-IP $remote_addr` — REPLACES any client-sent value. This one is a
#   security control, not plumbing. `src/lib/request-ip.ts` falls back to
#   `x-real-ip` whenever `X-Forwarded-For` yields no usable entry, and nginx
#   does NOT strip an inbound X-Real-IP on its own — so without this line a
#   client sending `X-Real-IP: 6.6.6.6` picks its own rate-limit bucket key.
#   (Same finding the Caddyfile fixes with `header_up -X-Real-IP`; nginx
#   overwrites rather than strips, which is equivalent here.)
#
# `X-Forwarded-For $proxy_add_x_forwarded_for` — APPENDS `$remote_addr` to any
#   inbound list. The app counts trusted hops from the RIGHT, so the last entry
#   being nginx-written is what makes `TRUSTED_PROXY_COUNT=1` correct. Do not
#   use `$http_x_forwarded_for` here: that passes the client's list through
#   verbatim and the last entry becomes client-chosen.
#
# `TRUSTED_PROXY_COUNT` — set to 1 in the app env for this file (ONE proxy:
#   nginx). If you later put Cloudflare or another proxy IN FRONT of nginx, the
#   count becomes 2 and the app must be told; see the hop-count table in the
#   Caddyfile header, which documents the measured behaviour of that chain.
#
# `client_max_body_size 60M` — REQUIRED, and the most likely thing to be
#   missing from a hand-written config. nginx's default is **1 MB**, and the app
#   accepts far more than that through this proxy: the OCR route caps a body at
#   `REMOTE_MAX_DATAURL_CHARS` (36,000,000 chars) plus slack ≈ **34 MB** for a
#   PDF, and a quiz-source batch is 25 MB × 5 files. MEASURED against a stub
#   upstream with nginx 1.31.5: a 500 KB POST → 200, a 2 MB POST → **413**.
#   The 413 arrives before the app sees the request, so the failure looks like
#   "the scanner does nothing" with no server-side log line.
#
#   ⚠️ PUT IT AT **SERVER** LEVEL, NOT INSIDE `location /`. Both placements work
#   for requests that match `location /`, but the server-level one is INHERITED
#   by every other location too. MEASURED with a config that also had
#   `location /static/`: location-level → POST 2 MB to /static/ = **413**;
#   server-level → **200**. The location-level placement breaks silently the
#   moment anyone adds a location block. The same reasoning applies to the
#   timeouts below, which is why they are server-level here.
#
# `proxy_read_timeout 300s` — REQUIRED. nginx's default is **60s**, and the OCR
#   remote leg holds the connection open for the whole Z.ai round trip: the
#   route budgets `REMOTE_TIMEOUT_MS = 120_000` and documents "~16s of silence
#   for a mid-size deck, more for a large one". MEASURED: 75s of upstream
#   silence through a default config → **504 at exactly 60.1s**. Raise this or
#   large PDFs fail intermittently with a gateway timeout that no app log
#   explains.
#
# `proxy_buffering off` — OPTIONAL, and measured NOT to matter for this app.
#   The generation routes set `x-accel-buffering: no` on their responses
#   (src/lib/ai/events.ts:86), which nginx honours per-response. MEASURED with
#   a 3-chunk/1s-interval stream: chunks arrived at +1045/+2055/+3068ms with
#   buffering ON (nginx default) and +1033/+2045/+3054ms with it OFF — no
#   difference. Kept anyway because it costs nothing and removes the dependency
#   on the upstream header being present on every streaming route.
#
# `proxy_cache_bypass $http_upgrade` — this is NOT the WebSocket upgrade
#   mechanism. `proxy_set_header Connection 'upgrade'` (from your config) works
#   because nginx also injects `Connection: upgrade` for `$http_upgrade`, but
#   the `$connection_upgrade` map below is the standard form and handles the
#   non-upgrade case (`close`) correctly.
#
# `proxy_set_header X-Forwarded-Proto https` (hardcoded, from your config) —
#   prefer `$scheme`. Hardcoding is correct only while this vhost is HTTPS-only;
#   with `$scheme` the HTTP→HTTPS redirect vhost would also be right if it ever
#   proxies rather than redirects.
# ─────────────────────────────────────────────────────────────────────────────

# WebSocket/SSE upgrade plumbing. `$connection_upgrade` is defined by a `map`,
# which must live in the `http {}` block — nginx refuses `map` inside `server`.
# Most distro nginx.conf files already include conf.d/*.conf from http{}, so
# dropping this file in sites-enabled (also included from http{}) works. If
# `nginx -t` reports `unknown "connection_upgrade" variable`, add the map to
# /etc/nginx/conf.d/upgrade-map.conf instead — it can only be declared once, so
# if it is already defined there, delete this copy.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── HTTP :80 — ACME challenge + permanent redirect ───────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name innovision.example.edu;   # ← REPLACE with your SITE_HOST

    # Certbot's HTTP-01 challenge. Keep this ABOVE the redirect: if it is
    # redirected too, renewal fails with a 301 and the cert silently expires.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS :443 — the application ─────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name innovision.example.edu;   # ← REPLACE with your SITE_HOST

    # ── Certificates ──
    # These are the certbot (Let's Encrypt) paths. If you use a different ACME
    # client, point them at wherever it writes the fullchain/privkey pair.
    ssl_certificate     /etc/letsencrypt/live/innovision.example.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/innovision.example.edu/privkey.pem;

    # Modern defaults. `ssl_protocols` deliberately excludes TLSv1/1.1 — the
    # app is session-heavy and cookie-authenticated, so a downgraded transport
    # is a real exposure, not a theoretical one.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # NOTE: HSTS is sent BY THE APP (next.config.ts, 2 years +
    # includeSubDomains, no preload) and passes through untouched. Do NOT add a
    # second `add_header Strict-Transport-Security` here — some clients
    # concatenate duplicate HSTS headers, and the app's value is the one the
    # security audit reviewed. Add `preload` only after HTTPS-everywhere is
    # proven for every subdomain.

    # ── WHY THESE LIVE AT SERVER LEVEL, NOT INSIDE `location /` ──────────────
    #
    # MEASURED, and the reason this matters: `client_max_body_size` and
    # `proxy_read_timeout` are INHERITED by every `location` block in this
    # server when declared here. Declared INSIDE `location /` instead, they
    # apply to that one location and nginx's 1 MB / 60s DEFAULTS apply
    # everywhere else. Measured with a config that also had `location /static/`:
    #
    #   directives in location /   →  POST 2 MB to /static/  = 413
    #   directives at server level →  POST 2 MB to /static/  = 200
    #
    # So the location-level placement works today and breaks the moment anyone
    # adds a location block (a static-assets path, an ACME challenge, a
    # websocket-only route). Server level is the placement that keeps being
    # correct as the file grows.

    # REQUIRED — nginx's default is 1 MB. MEASURED: a 500 KB POST returns 200,
    # a 2 MB POST returns 413. The app accepts far more through this proxy: the
    # OCR route caps a body at REMOTE_MAX_DATAURL_CHARS (36,000,000 chars) plus
    # slack ≈ 34 MB, and a quiz-source batch is 25 MB × 5 files. The 413 is
    # generated before the app sees the request, so the symptom is "the scanner
    # does nothing" with no server-side log line.
    client_max_body_size 60M;

    # REQUIRED — nginx's default is 60s. MEASURED: 75s of upstream silence
    # returns 504 at exactly 60.1s. The OCR remote leg budgets 120s
    # (REMOTE_TIMEOUT_MS) and the app documents "~16s of silence for a mid-size
    # deck, more for a large one". Without this, large PDFs fail intermittently
    # with a gateway timeout that no app log explains.
    proxy_read_timeout    300s;
    proxy_send_timeout    300s;
    proxy_connect_timeout 10s;

    # The app is session-heavy and serves personalized HTML. A caching proxy in
    # front of it is a correctness risk. nginx does not cache by default; this
    # is explicit so a future `proxy_cache` addition is a deliberate act.
    proxy_cache off;
    proxy_buffering off;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # ── Identity / origin headers (see the header block for why) ──
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # ── WebSocket / SSE upgrades (Supabase Realtime, streamed AI) ──
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Belt-and-braces for streaming. The app already sets
        # `x-accel-buffering: no` per-response and nginx honours it (measured:
        # no timing difference either way), so this is redundant — kept because
        # it removes the dependency on that header being present on every
        # streaming route.
        add_header X-Accel-Buffering no;
    }
}
