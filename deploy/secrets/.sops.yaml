# SOPS configuration for InnoVision production secrets.
#
# WHY THIS FILE EXISTS: before it, the VPS env was a hand-built pair of files
# (`.env` + `.env.local`) that lived ONLY on the server's filesystem. Nothing
# was versioned, so a rebuild-from-nothing meant reconstructing ~10 secrets from
# memory or a password manager, and the runbook's only advice was "store the
# backup encrypted and off-host" — a wish, not a mechanism.
#
# With SOPS the ENCRYPTED file is committed and the plaintext exists only:
#   - on the VPS, decrypted at deploy time into a 0600 file, and
#   - on an operator's machine, transiently, while editing.
#
# ── THE SPLIT: what goes here vs. what goes in GitHub ────────────────────────
# SOPS holds RUNTIME secrets (read per request / at process start, on the VPS).
# It deliberately does NOT hold the BUILD-time family (NEXT_PUBLIC_*,
# ALLOWED_HOSTS, TRUSTED_ORIGINS, SITE_URL): those are inlined by `next build`
# on a GitHub runner, so the CI job needs them as GitHub secrets/vars. Putting
# them in both places invites the exact divergence the runbook warns about — an
# image built against one origin, deployed beside an env file naming another.
#
# `deploy/remote-deploy.sh` closes that gap the only way that actually works:
# after the new container is healthy it READS BACK what the image baked (the
# app's entrypoint prints it) and FAILS the deploy if it disagrees with the
# expectations in this file. See `EXPECT_BAKED_*` in prod.env.example.
#
# ── SETUP ────────────────────────────────────────────────────────────────────
# 1. Generate a keypair (once, on a trusted machine):
#      age-keygen -o innovision-prod.agekey
#    The PUBLIC key (`age1...`) goes in the recipient below and is committed.
#    The PRIVATE key stays out of the repo and is placed on the VPS at
#    /etc/innovision/age.key (0600, root-owned) — see deploy/secrets/README.md.
# 2. Replace the placeholder recipient below with the real public key.
# 3. Encrypt:  sops --encrypt deploy/secrets/prod.env > deploy/secrets/prod.env.enc
#    Edit:     sops deploy/secrets/prod.env.enc
#
# ⚠️ LOSING THE PRIVATE KEY MAKES THE COMMITTED FILE UNRECOVERABLE. There is no
# escrow and no recovery path — keep a copy in a password manager, and treat
# that copy as the backup of record. Rotating the key means re-encrypting with
# `sops updatekeys` after adding the new recipient.

creation_rules:
  # Only files under deploy/secrets/ ending in .enc are encrypted. The narrow
  # pattern is deliberate: a broad rule (`path_regex: .*`) would silently try to
  # encrypt unrelated files, and `encrypted_regex` would then mangle them.
  - path_regex: .*\.enc$
    # age is the only key type used here: no cloud KMS, no GPG, nothing that
    # requires an account or a network call to decrypt on a bare VPS.
    age: >-
      age162skyp2jwrw9wnrs08wk26e4gwqa360jtaxkn36s62825q0kzygs9ar7t3
