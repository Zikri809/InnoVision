# Self-hosted AI/vision services that run alongside `supabase start`:
#   - insightface — single stateless face service (FastAPI + ONNX Runtime,
#     buffalo_l: SCRFD detection + 3D-68 landmark pose + ArcFace embedding in
#     ONE /extract call). Replaces the 5-container CompreFace stack; embeddings
#     live in Supabase (profile_face_samples, migration 0039), so the sidecar
#     is fully stateless (no volumes, no internal DB, no API keys). The Next.js
#     API routes call it over loopback only (127.0.0.1:8000), so classroom WiFi
#     can never reach it. FACE_SIDECAR_TOKEN is a defense-in-depth shared
#     secret against bind drift — provision a real value for production
#     (compose reads it from the shell env or a project-root `.env`, NOT
#     `.env.local`; the Next.js side reads .env.local as usual);
#     empty = header check disabled (local dev default).
#   - glm-ocr — GLM-OCR (Z.ai) served by vLLM with an [OI]-compatible API.
#     Replaces the unstable native-Ollama GLM path: vLLM is the officially
#     recommended production runtime for GLM-OCR (the Ollama [OI]-compat
#     vision endpoint is known to 502). The lecturer's browser talks to it over
#     loopback only (127.0.0.1:11434) — see docs/GLM_OCR_SETUP.md.
#
# Rollback note: the CompreFace volumes (compreface-postgres-data) may still
# exist on hosts that ran the old stack. They contain biometric data — do NOT
# `docker compose down -v` casually; disposal is a documented security step
# after the migration stability window (docs/INSIGHTFACE_SETUP.md §Cutover).
name: innovision

services:
  # GLM-OCR via vLLM — [OI]-compatible `/v1/chat/completions` + `/v1/models`.
  # The model (zai-org/GLM-OCR, ~0.9B params) is pulled from Hugging Face on
  # first start (~2.5 GB image + model weights). GPU-accelerated via the NVIDIA
  # container toolkit; falls back to CPU when no GPU is present (slow, ~30s/page).
  # Loopback-only: the browser OCR path talks to 127.0.0.1:11434, never the LAN.
  # Built from docker/glm-ocr/Dockerfile: the stock vLLM image's bundled
  # Transformers predates the `glm_ocr` architecture, so we layer a
  # Transformers-from-source install on top (per the official GLM-OCR docs).
  glm-ocr:
    build:
      context: .
      dockerfile: docker/glm-ocr/Dockerfile
    image: innovision-glm-ocr:local
    restart: unless-stopped
    command:
      - --model
      - zai-org/GLM-OCR
      - --served-model-name
      - glm-ocr
      - --port
      - "11434"
      - --host
      - 0.0.0.0
      - --max-model-len
      - "8192"
      - --gpu-memory-utilization
      - "0.7"
      - --enforce-eager
    ports:
      - "127.0.0.1:11434:11434" # loopback-only: [OI]-compatible API
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:11434/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # InsightFace sidecar — detection + pose + embedding in one call.
  # WEB_CONCURRENCY=1 (one model instance ≈ 350–500 MB with det + 3d68
  # landmark + recognition; a second worker would double that for no benefit
  # at classroom scale — the routes time out at 5s per call). Loopback-only
  # publish. Build context is docker/insightface itself (NOT the repo root —
  # shipping node_modules/playwright-report to the daemon costs minutes on
  # WSL2).
  insightface-service:
    build:
      context: ./docker/insightface
      dockerfile: Dockerfile
    image: innovision-insightface:local
    restart: unless-stopped
    environment:
      FACE_SIDECAR_TOKEN: "${FACE_SIDECAR_TOKEN:-}"
      WEB_CONCURRENCY: "1"
    ports:
      - "127.0.0.1:8000:8000" # loopback-only: /extract + /health
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
